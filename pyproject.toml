[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-compliance-checker"
version = "0.1.0"
requires-python = ">=3.11"
description = "Windows application for USB video quality and compliance checking"
dependencies = [
  "PySide6>=6.7",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "psutil>=5.9",
  "gspread>=6.1",
  "google-auth>=2.29",
  "python-dotenv>=1.0",
]
